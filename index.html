  <script>

/* ============================================================
   todo — Getting Things Done. Single file, localStorage database.
   Data model (backward-compatible with the previous todo_v1 format):
   { id, text, tags[], people[], done, createdAt, modifiedAt, doneAt,
     note, snoozedUntil, status, project, repeatDays }
   status ∈ inbox | next | waiting | someday   (active tasks only)
   snoozedUntil = the GTD tickler file
   people[] = who this task involves (@name in the capture bar)
   ============================================================ */

/* Muted, low-saturation tag palette — recognizable, never loud */
const TAG_COLORS = ["#64748B", "#6B8F71", "#8B7355", "#7C6E8F", "#5F8296", "#8F8A6B", "#946B6B", "#5E7D7D"];
const tagColor = tag => TAG_COLORS[Math.abs([...tag.toLowerCase()].reduce((a, c) => a + c.charCodeAt(0), 0)) % TAG_COLORS.length];
/* Tags keep exactly the case they were typed with ("QA" stays "QA").
   All matching, deduping and searching is case-insensitive. */
const normalizeTag = t => String(t).trim();
const sameTag = (a, b) => a.toLowerCase() === b.toLowerCase();
const hasTag = (item, tag) => item.tags.some(t => sameTag(t, tag));
const toggleIn = (list, tag) => list.some(x => sameTag(x, tag)) ? list.filter(x => !sameTag(x, tag)) : [...list, tag];
const dedupeTagsCI = tags => { const seen = new Map(); (tags || []).forEach(t => { const k = String(t).trim(); if (k && !seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); }); return [...seen.values()]; };
/* People (@name) reuse the same case-insensitive rules as tags but live in
   their own list so they never mix with #tags or areas. */
const hasPerson = (item, p) => (item.people || []).some(x => sameTag(x, p));
const PERSON_COLORS = ["#4F7CAC", "#7A6C9E", "#5B8A72", "#A0705C", "#6D8AA8", "#8A6F8E"];
const personColor = p => PERSON_COLORS[Math.abs([...p.toLowerCase()].reduce((a, c) => a + c.charCodeAt(0), 0)) % PERSON_COLORS.length];

const STATUSES = {
  inbox:   { label: "Inbox",   hint: "unprocessed" },
  next:    { label: "Next",    hint: "next actions" },
  waiting: { label: "Waiting", hint: "waiting on someone" },
  someday: { label: "Someday", hint: "someday / maybe" }
};
const STATUS_KEYS = Object.keys(STATUSES);
const validStatus = s => STATUS_KEYS.includes(s) ? s : null;

/* Input parsing:
   #tag  +Project  @person            — single-word
   #"multi word"  +"Multi Word"  @"Jane Doe"  — quoted (single quotes work too)
   Quoted forms are consumed first so their content can contain spaces.
   Routing shortcuts (consumed, never stored as tags):
     #w8 / #wait / #waiting → Waiting     #next → Next
     #someday / #sd → Someday             #inbox → Inbox
   Snooze shortcut:  ^6  ^6d  ^2w  ^1m  ^tomorrow  ^2026-10-01
   Email addresses are left alone: the "@" must start a token. */
const ROUTE_TOKENS = { w8: "waiting", wait: "waiting", waiting: "waiting", next: "next", someday: "someday", sd: "someday", inbox: "inbox" };
const parseSnoozeToken = raw => {
  const v = String(raw).trim().toLowerCase();
  if (!v) return null;
  if (v === "tomorrow" || v === "tmrw" || v === "tmr") return snoozeUntil(1);
  const rel = v.match(/^(\d{1,3})\s*(d|w|m)?$/);
  if (rel) { const n = +rel[1]; const mult = rel[2] === "w" ? 7 : rel[2] === "m" ? 30 : 1; return n > 0 ? snoozeUntil(n * mult) : null; }
  const abs = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (abs) { const d = new Date(+abs[1], +abs[2] - 1, +abs[3]); d.setHours(0, 0, 0, 0); return isNaN(d) || d.getTime() <= Date.now() ? null : d.getTime(); }
  return null;
};
const parseInput = text => {
  const tags = [], people = [];
  let project = null, status = null, snoozedUntil = null;
  let clean = String(text);
  clean = clean.replace(/(^|\s)#"([^"]+)"|(^|\s)#'([^']+)'/g, (m, s1, a, s2, b) => { const v = (a || b).trim(); if (v) tags.push(v); return s1 || s2 || ""; });
  clean = clean.replace(/(^|\s)\+"([^"]+)"|(^|\s)\+'([^']+)'/g, (m, s1, a, s2, b) => { const v = (a || b).trim(); if (v && !project) project = v; return s1 || s2 || ""; });
  clean = clean.replace(/(^|\s)@"([^"]+)"|(^|\s)@'([^']+)'/g, (m, s1, a, s2, b) => { const v = (a || b).trim(); if (v) people.push(v); return s1 || s2 || ""; });
  clean = clean.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu, (m, s, a) => {
    const route = ROUTE_TOKENS[a.toLowerCase()];
    if (route) { if (!status) status = route; } else tags.push(a);
    return s || "";
  });
  clean = clean.replace(/(^|\s)\+([\p{L}\p{N}_-]+)/gu, (m, s, a) => { if (!project) project = a; return s || ""; });
  clean = clean.replace(/(^|\s)@([\p{L}\p{N}_.-]+)/gu, (m, s, a) => { const v = a.replace(/[.-]+$/, ""); if (v) people.push(v); return s || ""; });
  clean = clean.replace(/(^|\s)\^(\S+)/g, (m, s, a) => { const ts = parseSnoozeToken(a); if (ts) { snoozedUntil = ts; return s || ""; } return m; });
  return { clean: clean.replace(/\s+/g, " ").trim(), tags, project, people: dedupeTagsCI(people), status, snoozedUntil };
};

const fmtDate = ts => {
  if (!ts) return null;
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fmtDay = ts => {
  if (!ts) return null;
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const isToday = ts => {
  if (!ts) return false;
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
};
const isThisWeek = ts => {
  if (!ts) return false;
  const d = new Date(ts), n = new Date();
  const sow = new Date(n); sow.setDate(n.getDate() - n.getDay() + (n.getDay() === 0 ? -6 : 1)); sow.setHours(0,0,0,0);
  return d >= sow;
};
const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
/* Snooze is calendar-day based: a task hidden "until day X" surfaces at the
   START of day X. Legacy hour-based timestamps (old +24h logic) therefore
   surface on their day, not at their recorded hour. */
const isSnoozed = i => !!(i.snoozedUntil && dayStart(i.snoozedUntil) > Date.now());
const daysAgo = ts => Math.floor((Date.now() - ts) / 864e5);

const themes = {
  light: {
    bg: "#F7F7F5", card: "#FFFFFF", cardDone: "#FBFBFA", text: "#1D1D1F", muted: "#6E6E76",
    faint: "#A5A5AC", timestamp: "#B8B8BE", border: "#E8E8E4", borderStrong: "#D8D8D2",
    inputBg: "#FFFFFF", accent: "#5E6AD2", accentText: "#FFFFFF", hover: "#F2F2EF",
    green: "#4C9A73", danger: "#C25454", dangerBg: "#FBF0F0",
    warnBg: "#FBF4E3", warnText: "#8A6210", warnBorder: "#EAD9AC",
    shadow: "0 1px 3px rgba(20,20,25,0.05)", shadowHover: "0 4px 14px rgba(20,20,25,0.07)"
  },
  dark: {
    bg: "#121215", card: "#1B1B1F", cardDone: "#18181C", text: "#E9E9EB", muted: "#98989F",
    faint: "#616168", timestamp: "#4E4E55", border: "#2A2A30", borderStrong: "#38383F",
    inputBg: "#1B1B1F", accent: "#8B93E8", accentText: "#15151A", hover: "#232329",
    green: "#5FAE87", danger: "#D97C7C", dangerBg: "#2A1B1B",
    warnBg: "#2A2415", warnText: "#D9B45C", warnBorder: "#4A3E1E",
    shadow: "0 1px 3px rgba(0,0,0,0.3)", shadowHover: "0 4px 14px rgba(0,0,0,0.4)"
  }
};

/* ---- storage layer ----
   Probes localStorage once. In sandboxed previews / embedded views /
   browsers with site data blocked, any access throws — fall back to an
   in-memory store so the app still works, and surface a clear warning. */
const store = (() => {
  const probe = () => {
    const k = "__todo_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
  };
  const normal = {
    getItem: k => window.localStorage.getItem(k),
    setItem: (k, v) => window.localStorage.setItem(k, v),
    removeItem: k => window.localStorage.removeItem(k),
    volatile: false, error: null, readable: true, retest: () => true
  };
  try { probe(); return normal; }
  catch (e) {
    /* Storage is broken. Two flavours:
       - SecurityError: fully blocked, reads fail too.
       - QuotaExceededError: the pool is FULL — reads still work, so existing
         data is intact; buffer writes in memory and flush once space frees up. */
    let readable = false;
    try { window.localStorage.getItem("__todo_probe__"); readable = true; } catch (_) {}
    const mem = {};
    const s = {
      getItem: k => {
        if (k in mem) return mem[k];
        if (readable) { try { return window.localStorage.getItem(k); } catch (_) {} }
        return null;
      },
      setItem: (k, v) => {
        v = String(v);
        /* opportunistic: try the real write first — if space was freed, use it */
        try { window.localStorage.setItem(k, v); delete mem[k]; return; } catch (_) {}
        mem[k] = v;
      },
      removeItem: k => {
        delete mem[k];
        try { window.localStorage.removeItem(k); } catch (_) {}
      },
      volatile: true, readable,
      error: (e && e.name ? e.name : "Error") + (e && e.message ? ": " + e.message : ""),
      /* Re-probe; on success flush buffered writes and switch to persistent mode */
      retest: () => {
        try {
          probe();
          for (const k of Object.keys(mem)) { window.localStorage.setItem(k, mem[k]); delete mem[k]; }
          s.volatile = false; s.error = null;
          s.getItem = normal.getItem; s.setItem = normal.setItem; s.removeItem = normal.removeItem;
          return true;
        } catch (e2) {
          s.error = (e2 && e2.name ? e2.name : "Error") + (e2 && e2.message ? ": " + e2.message : "");
          return false;
        }
      }
    };
    return s;
  }
})();
const isQuotaIssue = () => !!(store.error && /quota/i.test(store.error));
/* List what occupies the shared file:// storage pool (works while reads are allowed) */
const listStorageEntries = () => {
  const out = [];
  try {
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      let v = "";
      try { v = window.localStorage.getItem(k) || ""; } catch (e) {}
      out.push({ key: k, bytes: (k.length + v.length) * 2 }); /* UTF-16 ≈ 2 bytes/char */
    }
  } catch (e) {}
  return out.sort((a, b) => b.bytes - a.bytes);
};

/* Snooze works on CALENDAR days: "Tomorrow" means the start of the next
   day, not now+24h. Target is local midnight of the chosen day (DST-safe). */
const SNOOZE_OPTIONS = [
  { label: "Tomorrow", days: 1 },
  { label: "3 days", days: 3 },
  { label: "1 week", days: 7 },
  { label: "2 weeks", days: 14 },
  { label: "1 month", days: 30 }
];
/* Recurring tasks: when completed, a fresh copy is created, snoozed for the
   interval, and lands on Next when the day arrives (completion-based cycle). */
const REPEAT_OPTIONS = [
  { label: "Daily", days: 1 },
  { label: "Weekly", days: 7 },
  { label: "Every 2 weeks", days: 14 },
  { label: "Monthly", days: 30 },
  { label: "Quarterly", days: 90 }
];
const repeatLabel = days =>
  days === 1 ? "daily" : days === 7 ? "weekly" : days === 14 ? "every 2 weeks"
  : days === 30 ? "monthly" : days === 90 ? "quarterly" : "every " + days + " days";
const snoozeUntil = days => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + days);
  return d.getTime();
};
/* ---- recurrence ----
   repeatMode "after"   : N days after completion (repeatDays)         — original behaviour
   repeatMode "weekly"  : fixed weekday (repeatWeekday 0=Sun..6=Sat)
   repeatMode "monthly" : fixed day of month (repeatDom 1..31, clamped to month length)
   Fixed schedules never drift: the next instance is the next calendar
   occurrence strictly after today, regardless of when you ticked the box. */
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const isRecurring = i => !!(i.repeatMode === "weekly" || i.repeatMode === "monthly" || i.repeatDays);
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : n % 10 === 1 ? "st" : n % 10 === 2 ? "nd" : n % 10 === 3 ? "rd" : "th");
const recurrenceLabel = i =>
  i.repeatMode === "weekly" ? "every " + WEEKDAYS[i.repeatWeekday]
  : i.repeatMode === "monthly" ? "monthly on the " + ordinal(i.repeatDom)
  : i.repeatDays ? repeatLabel(i.repeatDays) + " after completion" : "";
const nextOccurrence = i => {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (i.repeatMode === "weekly") {
    const delta = ((i.repeatWeekday - d.getDay()) + 7) % 7 || 7;
    d.setDate(d.getDate() + delta);
    return d.getTime();
  }
  if (i.repeatMode === "monthly") {
    const dom = i.repeatDom;
    const clampTo = (y, m) => new Date(y, m, Math.min(dom, new Date(y, m + 1, 0).getDate()));
    let n = clampTo(d.getFullYear(), d.getMonth());
    if (n.getTime() <= d.getTime()) n = clampTo(d.getFullYear(), d.getMonth() + 1);
    n.setHours(0, 0, 0, 0);
    return n.getTime();
  }
  return snoozeUntil(i.repeatDays || 1);
};
/* Waiting age: days since the last ping, or since the task was created */
const waitingSince = i => i.lastPingAt || i.createdAt || i.modifiedAt || null;
const waitingDays = i => { const s = waitingSince(i); return s ? Math.floor((Date.now() - s) / 864e5) : null; };

/* Upcoming buckets for the Snoozed view: when does it come back? (Mon-based weeks) */
const UPCOMING_ORDER = ["Tomorrow", "This week", "Next week", "Later this month", "Later"];
const upcomingBucket = ts => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((dayStart(ts) - today.getTime()) / 864e5);
  if (days <= 1) return "Tomorrow";
  const dow = (today.getDay() + 6) % 7;           /* 0 = Monday */
  const endOfWeek = 6 - dow;                      /* days until Sunday */
  if (days <= endOfWeek) return "This week";
  if (days <= endOfWeek + 7) return "Next week";
  const d = new Date(ts);
  if (d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth()) return "Later this month";
  return "Later";
};

/* ============================================================
   Sync — the task list lives in a GitHub gist, optionally encrypted.

   Why a gist: free, versioned, works from a static page (GitHub Pages),
   needs only a classic token with the single "gist" scope.
   Why encrypt: a "secret" gist is NOT private — anyone with its URL can
   read it. With a passphrase the gist holds only AES-GCM ciphertext.

   Payload (before encryption):
     { version, savedAt, items[], tombstones{id: deletedAt},
       areas[], areasAt, brainDump, brainAt }
   Merge = per task, newest stamp wins (modifiedAt / createdAt / doneAt);
   a deletion is a tombstone and wins over any older copy of the task.
   ============================================================ */
const SYNC_KEY = "todo_sync";
const TOMB_KEY = "todo_tombstones";
const GIST_FILE = "todo.json";
const GIST_API = "https://api.github.com";
const TOMB_TTL_MS = 180 * 864e5; /* forget tombstones after 6 months */

const itemStamp = i => Math.max(i.modifiedAt || 0, i.createdAt || 0, i.doneAt || 0);
const loadTombstones = () => { try { return JSON.parse(store.getItem(TOMB_KEY) || "{}") || {}; } catch (e) { return {}; } };

/* Merge two task sets + tombstone maps. Pure; returns new objects. */
const mergeSets = (localItems, localTombs, remoteItems, remoteTombs) => {
  const tombs = { ...(remoteTombs || {}) };
  Object.entries(localTombs || {}).forEach(([id, ts]) => { tombs[id] = Math.max(ts, tombs[id] || 0); });
  const byId = new Map();
  (remoteItems || []).forEach(i => byId.set(String(i.id), i));
  (localItems || []).forEach(i => {
    const k = String(i.id), r = byId.get(k);
    if (!r || itemStamp(i) >= itemStamp(r)) byId.set(k, i);
  });
  const now = Date.now();
  const items = [];
  byId.forEach((i, k) => { if (!(tombs[k] && tombs[k] >= itemStamp(i))) items.push(i); });
  /* prune: tombstones that are old and no longer shadow anything */
  Object.keys(tombs).forEach(k => { if (now - tombs[k] > TOMB_TTL_MS && !byId.has(k)) delete tombs[k]; });
  /* keep a stable order: by creation, like the app does */
  items.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  return { items, tombs };
};

/* ---- crypto (WebCrypto, AES-256-GCM, PBKDF2-SHA256) ---- */
const bufToB64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const deriveKey = async (pass, salt) => {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
};
const encryptText = async (pass, text) => {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
  return JSON.stringify({ "todo-encrypted": 1, alg: "AES-GCM/PBKDF2-250k", salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(data) });
};
const decryptText = async (pass, obj) => {
  const key = await deriveKey(pass, b64ToBuf(obj.salt));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBuf(obj.iv) }, key, b64ToBuf(obj.data));
  return new TextDecoder().decode(plain);
};

/* ---- gist REST ---- */
const gistHeaders = token => ({ Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28" });
class SyncError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }
const gistRequest = async (token, method, path, body) => {
  let res;
  try { res = await fetch(GIST_API + path, { method, headers: gistHeaders(token), body: body ? JSON.stringify(body) : undefined, cache: "no-store" }); }
  catch (e) { throw new SyncError("offline", "Network error — offline?"); }
  if (res.status === 401) throw new SyncError("auth", "GitHub rejected the token (401). Is it a classic token with the gist scope, and not expired?");
  if (res.status === 403) throw new SyncError("auth", "GitHub refused (403) — token lacks the gist scope, or rate limit hit.");
  if (res.status === 404) throw new SyncError("notfound", "Gist not found (404). Check the gist ID, or that the token belongs to the same account.");
  if (!res.ok) throw new SyncError("http", "GitHub error " + res.status);
  return res.json();
};
const gistRead = async (token, gistId) => {
  const g = await gistRequest(token, "GET", "/gists/" + gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) throw new SyncError("format", "The gist has no " + GIST_FILE + " file.");
  if (f.truncated && f.raw_url) {
    let r; try { r = await fetch(f.raw_url, { cache: "no-store" }); } catch (e) { throw new SyncError("offline", "Network error while reading the gist."); }
    if (!r.ok) throw new SyncError("http", "Could not read the gist content (" + r.status + ")");
    return r.text();
  }
  return f.content;
};
const gistWrite = (token, gistId, content) => gistRequest(token, "PATCH", "/gists/" + gistId, { files: { [GIST_FILE]: { content } } });
const gistCreate = async (token, content) => {
  const g = await gistRequest(token, "POST", "/gists", { description: "todo — task sync (do not edit by hand)", public: false, files: { [GIST_FILE]: { content } } });
  return g.id;
};

/* payload <-> text, honouring the passphrase */
const encodePayload = async (payload, pass) => { const text = JSON.stringify(payload); return pass ? encryptText(pass, text) : text; };
const decodePayload = async (text, pass) => {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { throw new SyncError("format", "The gist does not contain valid JSON."); }
  if (obj && obj["todo-encrypted"]) {
    if (!pass) throw new SyncError("pass", "This gist is encrypted — enter the passphrase.");
    let plain;
    try { plain = await decryptText(pass, obj); } catch (e) { throw new SyncError("pass", "Wrong passphrase (could not decrypt the gist)."); }
    try { obj = JSON.parse(plain); } catch (e) { throw new SyncError("format", "Decrypted content is not valid JSON."); }
  } else if (pass && obj && Array.isArray(obj.items)) {
    /* plain gist but a passphrase is set: accept it once, the next push will encrypt it */
  }
  if (!obj || !Array.isArray(obj.items)) throw new SyncError("format", "Unexpected gist format.");
  return obj;
};

/* Turn plain-text http(s) URLs into safe links. Text is NEVER rendered as
   HTML (React escapes it), so pasted markup cannot inject — URLs inside it
   simply become clickable. Trailing punctuation stays outside the link. */
const URL_SPLIT_RE = /(https?:\/\/[^\s<>"')\]]+)/g;
const linkify = (text, accent) => String(text).split(URL_SPLIT_RE).map((part, idx) => {
  if (!/^https?:\/\//.test(part)) return part;
  const m = part.match(/^(.*?)([.,;:!?]*)$/);
  const url = m[1], trail = m[2];
  return [
    h("a", {
      key: "u" + idx, href: url, target: "_blank", rel: "noopener noreferrer",
      onClick: e => e.stopPropagation(),
      style: { color: accent, textDecoration: "underline", textUnderlineOffset: 2, wordBreak: "break-all" }
    }, url),
    trail
  ];
});

function SuggestInput({ placeholder, suggestionsPool, exclude, onSubmit, onClose, th, width }) {
  const [val, setVal] = React.useState("");
  const ref = React.useRef();
  React.useEffect(() => ref.current?.focus(), []);
  const exLower = (exclude || []).map(t => t.toLowerCase());
  const suggestions = suggestionsPool.filter(t => !exLower.includes(t.toLowerCase()) && t.toLowerCase().includes(val.toLowerCase()));
  const submit = v => { const t = (v !== undefined ? v : val).trim().replace(/^[#+@]/, ""); if (t) onSubmit(t); onClose(); };
  return h("div", { style: { position: "relative", display: "inline-flex", alignItems: "center", gap: 4 } },
    h("input", {
      ref, value: val, onChange: e => setVal(e.target.value),
      onKeyDown: e => { if (e.key === "Enter") submit(); if (e.key === "Escape") onClose(); },
      placeholder,
      style: { width: width || 100, padding: "3px 9px", fontSize: 11.5, border: "1px solid " + th.accent, borderRadius: 20, outline: "none", background: th.inputBg, color: th.text }
    }),
    suggestions.length > 0 && h("div", {
      style: { position: "absolute", top: "100%", left: 0, background: th.card, border: "1px solid " + th.border, borderRadius: 10, zIndex: 10, minWidth: 140, maxHeight: 190, overflowY: "auto", boxShadow: th.shadowHover, marginTop: 4, padding: 4 }
    }, suggestions.map(s => h("div", {
      key: s, onMouseDown: e => { e.preventDefault(); submit(s); },
      style: { padding: "6px 10px", cursor: "pointer", fontSize: 12.5, color: th.text, fontWeight: 500, borderRadius: 6 },
      onMouseEnter: e => e.currentTarget.style.background = th.hover,
      onMouseLeave: e => e.currentTarget.style.background = "transparent"
    }, s)))
  );
}

/* phone or not — drives the "…" card menu; everything else is CSS */
const useMedia = query => {
  const get = () => { try { return window.matchMedia(query).matches; } catch (e) { return false; } };
  const [m, setM] = React.useState(get);
  React.useEffect(() => {
    let mq; try { mq = window.matchMedia(query); } catch (e) { return; }
    const on = () => setM(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, [query]);
  return m;
};

  const [editNoteId, setEditNoteId] = React.useState(null);
  const [noteDraft, setNoteDraft] = React.useState("");
  const [snoozeMenuFor, setSnoozeMenuFor] = React.useState(null);
  const [repeatMenuFor, setRepeatMenuFor] = React.useState(null);
  const [moveMenuFor, setMoveMenuFor] = React.useState(null);
  const [showReview, setShowReview] = React.useState(false);
  const [brainDump, setBrainDump] = React.useState(() => {
    try { return store.getItem(BRAINDUMP_KEY) || ""; } catch(e) { return ""; }
  });
  const [showBrainDump, setShowBrainDump] = React.useState(() => {
    try { return store.getItem(BRAINDUMP_OPEN_KEY) === "1"; } catch(e) { return false; }
  });
  const [lastReview, setLastReview] = React.useState(() => {
    try { return Number(store.getItem(REVIEW_KEY)) || null; } catch(e) { return null; }
  });
  const [saved, setSaved] = React.useState(null);
  const [storageBroken, setStorageBroken] = React.useState(store.volatile);
  const [showInspector, setShowInspector] = React.useState(false);
  const [storageEntries, setStorageEntries] = React.useState([]);
  const refreshInspector = () => setStorageEntries(listStorageEntries());
  const retestStorage = () => {
    if (store.retest()) {
      setStorageBroken(false); setShowInspector(false);
      saveItems(items); /* persist current state for real */
      setSaved("ok"); setTimeout(() => setSaved(null), 1500);
      return true;
    }
    return false;
  };
  const deleteStorageKey = k => {
    if (!confirm("Delete \u201C" + k + "\u201D from browser storage? If it belongs to another local HTML app, that app will lose its data.")) return;
    try { window.localStorage.removeItem(k); } catch (e) {}

    retestStorage(); /* if enough space was freed, recover automatically */
  };
  const [search, setSearch] = React.useState("");
  const [view, setView] = React.useState(() => {
    try { return store.getItem(VIEW_KEY) || "inbox"; } catch(e) { return "inbox"; }
  });
  const [showStats, setShowStats] = React.useState(false);
  const [dark, setDark] = React.useState(() => {
    try { return store.getItem(THEME_KEY) === "dark"; } catch(e) { return false; }
  });
  const [compact, setCompact] = React.useState(() => {
    try { return store.getItem(COMPACT_KEY) === "1"; } catch(e) { return false; }
  });
  const [collapsedGroups, setCollapsedGroups] = React.useState(() => {
    try { return new Set(JSON.parse(store.getItem(COLLAPSED_KEY) || "[]")); } catch(e) { return new Set(); }
  });
  /* areas of responsibility = designated tags */
  const [areaTags, setAreaTags] = React.useState(() => {
    try { return JSON.parse(store.getItem(AREAS_KEY) || "[]"); } catch(e) { return []; }
  });
  const toggleArea = tag => setAreaTags(prev => toggleIn(prev, tag).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" })));
  const th = dark ? themes.dark : themes.light;

  /* minute tick so expired snoozes resurface automatically */
  const [, setTick] = React.useState(0);
  React.useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 60000); return () => clearInterval(t); }, []);

  React.useEffect(() => { document.body.style.background = th.bg; }, [dark]);
  React.useEffect(() => { try { store.setItem(THEME_KEY, dark ? "dark" : "light"); } catch(e) {} }, [dark]);
  React.useEffect(() => { try { store.setItem(COMPACT_KEY, compact ? "1" : "0"); } catch(e) {} }, [compact]);
  React.useEffect(() => { try { store.setItem(COLLAPSED_KEY, JSON.stringify([...collapsedGroups])); } catch(e) {} }, [collapsedGroups]);
  React.useEffect(() => { try { store.setItem(BRAINDUMP_KEY, brainDump); } catch(e) {} }, [brainDump]);
  React.useEffect(() => { try { store.setItem(BRAINDUMP_OPEN_KEY, showBrainDump ? "1" : "0"); } catch(e) {} }, [showBrainDump]);
  React.useEffect(() => { try { store.setItem(VIEW_KEY, view); } catch(e) {} }, [view]);
  React.useEffect(() => { try { lastReview ? store.setItem(REVIEW_KEY, String(lastReview)) : store.removeItem(REVIEW_KEY); } catch(e) {} }, [lastReview]);
  React.useEffect(() => { try { store.setItem(AREAS_KEY, JSON.stringify(areaTags)); } catch(e) {} }, [areaTags]);
  /* every change to tasks → persisted immediately */
  React.useEffect(() => { const ok = saveItems(items); if (!ok) setStorageBroken(true); setSaved(ok ? "ok" : "fail"); const t = setTimeout(() => setSaved(null), 1500); return () => clearTimeout(t); }, [items]);

  const allTags = (() => {
    const seen = new Map();
    items.flatMap(i => i.tags).forEach(t => { const k = t.toLowerCase(); if (!seen.has(k)) seen.set(k, t); });
    return [...seen.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
  })();
  const allProjects = [...new Set(items.map(i => i.project).filter(Boolean))].sort();
  const allPeople = (() => {
    const seen = new Map();
    items.flatMap(i => i.people || []).forEach(p => { const k = p.toLowerCase(); if (!seen.has(k)) seen.set(k, p); });
    return [...seen.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
  })();

  /* Tags with no active task and no activity for 30 days retire from all
     pickers and suggestions. Data is untouched — archived tasks keep their
     tags, and using a retired tag again instantly revives it. Tags marked
     as areas never retire (they are deliberately curated). */
  const STALE_TAG_MS = 30 * 864e5;
  const tagMeta = (() => {
    const m = new Map();
    items.forEach(i => i.tags.forEach(t => {
      const k = t.toLowerCase();
      const e = m.get(k) || { hasActive: false, last: 0 };
      if (!i.done) e.hasActive = true;
      e.last = Math.max(e.last, i.modifiedAt || 0, i.createdAt || 0, i.doneAt || 0);
      m.set(k, e);
    }));
    return m;
  })();
  const isStaleTag = t => {
    const e = tagMeta.get(t.toLowerCase());
    return !!e && !e.hasActive && e.last > 0 && (Date.now() - e.last) > STALE_TAG_MS;
  };
  const visibleTags = allTags.filter(t => !isStaleTag(t) || areaTags.some(a => sameTag(a, t)));

  const active = items.filter(i => !i.done);
  const activePeople = allPeople.filter(p => active.some(i => hasPerson(i, p)));
  const listCount = s => active.filter(i => i.status === s && !isSnoozed(i)).length;
  const snoozedCount = active.filter(isSnoozed).length;
  const postponedCount = active.filter(i => i.snoozeCount >= POSTPONED_MANY).length;
  const projectsWithoutNext = allProjects.filter(p => {
    const t = active.filter(i => i.project === p);
    return t.length > 0 && !t.some(i => i.status === "next" && !isSnoozed(i));
  });
  /* per-area review data: what's moving, what's queued, what's slipping */
  const areaInfo = tag => {
    const tagged = items.filter(i => hasTag(i, tag));
    const act = tagged.filter(i => !i.done);
    const c = s => act.filter(i => i.status === s && !isSnoozed(i)).length;
    const last = Math.max(0, ...tagged.map(i => Math.max(i.modifiedAt || 0, i.createdAt || 0, i.doneAt || 0)));
    return { next: c("next"), waiting: c("waiting"), someday: c("someday"), inbox: c("inbox"),
             snoozed: act.filter(isSnoozed).length, doneWeek: tagged.filter(i => i.done && isThisWeek(i.doneAt)).length,
             activeTotal: act.length, last, neglected: c("next") === 0 };
  };
  const neglectedAreas = areaTags.filter(t => areaInfo(t).neglected);

  const stats = {
    createdToday: items.filter(i => isToday(i.createdAt)).length,
    completedToday: items.filter(i => i.done && isToday(i.doneAt)).length,
    completedWeek: items.filter(i => i.done && isThisWeek(i.doneAt)).length,
    totalActive: active.length,
    totalDone: items.length - active.length,
    total: items.length
  };

  /* ---------------- mutations (each persists via the [items] effect) ---------------- */
  const updateItems = fn => setItems(prev => fn(prev));
  const add = () => {
    if (!input.trim()) return;
    const { clean, tags, project, people, status: routed, snoozedUntil } = parseInput(input);
    /* a routing token (#w8, #next…) wins; otherwise capture into the current list, else Inbox */
    const status = routed || (STATUS_KEYS.includes(view) ? view : "inbox");
    updateItems(prev => [...prev, normalizeItem({
      id: Date.now(), text: clean || input.trim(), tags, project, people,
      done: false, createdAt: Date.now(), status, snoozedUntil
    })]);
    setInput("");
    if (routed && routed !== view && STATUS_KEYS.includes(view)) flash("Added to " + STATUSES[routed].label + (snoozedUntil ? " · hidden until " + fmtDay(snoozedUntil) : ""));
    else if (snoozedUntil) flash("Snoozed until " + fmtDay(snoozedUntil));
  };
  /* short confirmation line under the capture bar */
  const [flashMsg, setFlashMsg] = React.useState(null);
  const flash = msg => { setFlashMsg(msg); clearTimeout(flash.t); flash.t = setTimeout(() => setFlashMsg(null), 2600); };
  const startEdit = item => { setEditId(item.id); setEditText(item.text); };
  const saveEdit = id => { updateItems(prev => prev.map(i => i.id === id ? { ...i, text: editText.trim() || i.text, modifiedAt: Date.now() } : i)); setEditId(null); };
  const startNote = item => { setEditNoteId(item.id); setNoteDraft(item.note || ""); };
  const saveNote = id => { updateItems(prev => prev.map(i => i.id === id ? { ...i, note: noteDraft.trim(), modifiedAt: Date.now() } : i)); setEditNoteId(null); };
  const deleteNote = id => { updateItems(prev => prev.map(i => i.id === id ? { ...i, note: "", modifiedAt: Date.now() } : i)); setEditNoteId(null); };
  /* every manual snooze bumps snoozeCount — the "how often do I put this off?" signal */
  const snooze = (id, days) => { updateItems(prev => prev.map(i => i.id === id ? { ...i, snoozedUntil: snoozeUntil(days), snoozeCount: (i.snoozeCount || 0) + 1, modifiedAt: Date.now() } : i)); setSnoozeMenuFor(null); };
  /* snooze to an explicit local date (from the date picker), start of that day */
  const snoozeToDate = (id, ymd) => {
    const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return;
    const d = new Date(+m[1], +m[2] - 1, +m[3]); d.setHours(0, 0, 0, 0);
    if (d.getTime() <= Date.now()) return;
    updateItems(prev => prev.map(i => i.id === id ? { ...i, snoozedUntil: d.getTime(), snoozeCount: (i.snoozeCount || 0) + 1, modifiedAt: Date.now() } : i));
    setSnoozeMenuFor(null);
  };
  /* Ping a Waiting task: note the nudge, restart the waiting clock, hide it for a week */
  const ping = (id, days = 7) => updateItems(prev => prev.map(i => {
    if (i.id !== id) return i;
    const now = Date.now();
    const line = "Pinged " + fmtDay(now);
    return { ...i, lastPingAt: now, pingCount: (i.pingCount || 0) + 1, snoozedUntil: snoozeUntil(days), modifiedAt: now,
             note: i.note ? i.note + "\n" + line : line };
  }));
  /* fixed-schedule recurrence */
  const setRepeatWeekly = (id, weekday) => { updateItems(prev => prev.map(i => i.id === id ? { ...i, repeatMode: "weekly", repeatWeekday: weekday, repeatDays: null, modifiedAt: Date.now() } : i)); setRepeatMenuFor(null); };
  const setRepeatMonthly = (id, dom) => { if (!(dom >= 1 && dom <= 31)) return; updateItems(prev => prev.map(i => i.id === id ? { ...i, repeatMode: "monthly", repeatDom: dom, repeatDays: null, modifiedAt: Date.now() } : i)); setRepeatMenuFor(null); };
  const clearRepeat = id => { updateItems(prev => prev.map(i => i.id === id ? { ...i, repeatMode: null, repeatDays: null, repeatWeekday: null, repeatDom: null, modifiedAt: Date.now() } : i)); setRepeatMenuFor(null); };
  /* Copy a 1:1 agenda for a person to the clipboard: open Next/Inbox items to
     discuss, then what you're waiting for from them (with how long). */
  const [copiedAgendaFor, setCopiedAgendaFor] = React.useState(null);
  const agendaText = p => {
    const mine = active.filter(i => hasPerson(i, p));
    const line = i => "• " + i.text + (i.project ? " (" + i.project + ")" : "");
    const discuss = mine.filter(i => i.status !== "waiting" && i.status !== "someday");
    const waiting = mine.filter(i => i.status === "waiting");
    const out = ["Agenda – " + p + ", " + fmtDay(Date.now())];
    if (discuss.length) out.push(...discuss.map(line));
    if (waiting.length) out.push("Czekam od Ciebie:", ...waiting.map(i => line(i) + (waitingDays(i) > 0 ? " – od " + waitingDays(i) + " dni" : "")));
    if (!discuss.length && !waiting.length) out.push("(brak otwartych punktów)");
    return out.join("\n");
  };
  const copyAgenda = p => {
    const text = agendaText(p);
    const done = () => { setCopiedAgendaFor(p); setTimeout(() => setCopiedAgendaFor(null), 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => prompt("Copy the agenda:", text));
    else prompt("Copy the agenda:", text);
  };
  /* Rename a tag everywhere (case-insensitive match). Renaming onto an
     existing tag merges the two. Areas and the active filter follow along. */
  const renameTag = (from, to) => {
    const t = normalizeTag(to);
    if (!t || sameTag(from, t) && from === t) return;
    updateItems(prev => prev.map(i => hasTag(i, from) ? { ...i, tags: dedupeTagsCI(i.tags.map(x => sameTag(x, from) ? t : x)), modifiedAt: Date.now() } : i));
    setAreaTags(prev => prev.some(a => sameTag(a, from)) ? dedupeTagsCI(prev.map(a => sameTag(a, from) ? t : a)).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" })) : prev);
    setFilterTags(prev => dedupeTagsCI(prev.map(a => sameTag(a, from) ? t : a)));
  };
  const addPerson = (id, p) => updateItems(prev => prev.map(i => i.id === id && !hasPerson(i, p) ? { ...i, people: [...(i.people || []), p.trim()], modifiedAt: Date.now() } : i));
  const removePerson = (id, p) => updateItems(prev => prev.map(i => i.id === id ? { ...i, people: (i.people || []).filter(x => x !== p), modifiedAt: Date.now() } : i));
  /* Complete a task AND spawn its follow-up in Waiting: same project, tags and
     people carry over, the title is prefilled and opened for editing so it is
     one keystroke away from "Waiting for X to reply". */
  const completeAndWait = id => {
    const src = items.find(i => i.id === id);
    if (!src) return;
    const now = Date.now();
    const newId = now + Math.random();
    const who = (src.people || []).length ? " from " + src.people.join(", ") : "";
    const follow = normalizeItem({
      id: newId, text: "Waiting for reply" + who + ": " + src.text, tags: src.tags, people: src.people, project: src.project,
      done: false, createdAt: now, status: "waiting"
    });
    if (!src.done) toggle(id); /* handles recurring tasks the same way as a normal completion */
    updateItems(prev => prev.concat(follow));
    setView("waiting"); setFilterTags([]); setSearch("");
    setEditId(newId); setEditText(follow.text);
  };
  const unsnooze = id => updateItems(prev => prev.map(i => i.id === id ? { ...i, snoozedUntil: null, modifiedAt: Date.now() } : i));
  const setRepeat = (id, days) => { updateItems(prev => prev.map(i => i.id === id ? { ...i, repeatDays: days, repeatMode: days ? "after" : null, repeatWeekday: null, repeatDom: null, modifiedAt: Date.now() } : i)); setRepeatMenuFor(null); };
  const setStatus = (id, status) => { updateItems(prev => prev.map(i => i.id === id ? { ...i, status, modifiedAt: Date.now() } : i)); setMoveMenuFor(null); };
  const addTag = (id, tag) => updateItems(prev => prev.map(i => i.id === id && !hasTag(i, tag) ? { ...i, tags: [...i.tags, tag.trim()], modifiedAt: Date.now() } : i));
  const removeTag = (id, tag) => updateItems(prev => prev.map(i => i.id === id ? { ...i, tags: i.tags.filter(t => t !== tag), modifiedAt: Date.now() } : i));
  const setProject = (id, project) => updateItems(prev => prev.map(i => i.id === id ? { ...i, project: project || null, modifiedAt: Date.now() } : i));
  const toggle = id => updateItems(prev => {
    const src = prev.find(i => i.id === id);
    if (!src) return prev;
    if (!src.done && isRecurring(src)) {
      /* completing a recurring task: archive this occurrence (recurrence
         detaches to history), spawn the next one snoozed until its next
         occurrence — interval after completion, or the fixed calendar slot */
      const now = Date.now();
      const doneCopy = { ...src, done: true, doneAt: now, modifiedAt: now, snoozedUntil: null, repeatDays: null, repeatMode: null, repeatWeekday: null, repeatDom: null };
      const nextInstance = { ...src, id: now + Math.random(), done: false, doneAt: null, createdAt: now, modifiedAt: null,
                             status: "next", snoozedUntil: nextOccurrence(src), snoozeCount: 0, lastPingAt: null, pingCount: 0 };
      return prev.map(i => i.id === id ? doneCopy : i).concat(nextInstance);
    }
    return prev.map(i => i.id === id
      ? { ...i, done: !i.done, modifiedAt: Date.now(), doneAt: !i.done ? Date.now() : null, snoozedUntil: !i.done ? null : i.snoozedUntil }
      : i);
  });
  /* deleting leaves a tombstone so the deletion also wins on other devices */
  const tombsRef = React.useRef(loadTombstones());
  const addTombstones = ids => { const now = Date.now(); ids.forEach(id => { tombsRef.current[String(id)] = now; }); saveTombstones(tombsRef.current); };
  const remove = id => { addTombstones([id]); updateItems(prev => prev.filter(i => i.id !== id)); };
  const duplicate = id => updateItems(prev => {
    const src = prev.find(i => i.id === id);
    if (!src) return prev;
    return [...prev, { ...src, id: Date.now(), done: false, createdAt: Date.now(), modifiedAt: null, doneAt: null, snoozedUntil: null, snoozeCount: 0, lastPingAt: null, pingCount: 0 }];
  });

  /* ---------------- import / export ---------------- */
  const exportJSON = () => {
    const data = JSON.stringify(items, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "todo-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const fileRef = React.useRef();
  const importJSON = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) {
          if (items.length > 0 && !confirm("Importing will replace your current " + items.length + " tasks with " + data.length + " tasks from the file. Continue?")) return;
          const imported = data.map(normalizeItem);
          const keep = new Set(imported.map(i => String(i.id)));
          addTombstones(items.filter(i => !keep.has(String(i.id))).map(i => i.id)); /* replaced tasks are deletions for sync */
          setItems(imported);
        } else { alert("Invalid file format — expected an array of tasks."); }
      } catch (err) { alert("Could not parse JSON: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  /* ---------------- file auto-save (File System Access API) ----------------
     Persistence that works even when localStorage is blocked: pick a JSON
     file once, and every change is written straight to it. Chrome/Edge. */
  const fsSupported = typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function";
  const [fileHandle, setFileHandle] = React.useState(null);
  const [fileName, setFileName] = React.useState(null);
  const [fileState, setFileState] = React.useState("off"); /* off | on | error */
  const writeToFile = async (handle, data) => {
    const w = await handle.createWritable();
    await w.write(data);
    await w.close();
  };
  const enableFileAutosave = async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "todo-data.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      await writeToFile(handle, JSON.stringify(items, null, 2));
      setFileHandle(handle); setFileName(handle.name); setFileState("on");
    } catch (e) { if (!e || e.name !== "AbortError") setFileState("error"); }
  };
  const resumeFromFile = async () => {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      const file = await handle.getFile();
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) { alert("Invalid file format — expected an array of tasks."); return; }
      setItems(data.map(normalizeItem));
      setFileHandle(handle); setFileName(handle.name); setFileState("on");
    } catch (e) { if (!e || e.name !== "AbortError") setFileState("error"); }
  };
  /* every change to tasks → also written to the chosen file */
  React.useEffect(() => {
    if (!fileHandle) return;
    let cancelled = false;
    writeToFile(fileHandle, JSON.stringify(items, null, 2))
      .then(() => { if (!cancelled && fileState !== "on") setFileState("on"); })
      .catch(() => { if (!cancelled) setFileState("error"); });
    return () => { cancelled = true; };
  }, [items, fileHandle]);

  /* ---------------- gist sync ----------------
     config = { token, gistId, pass }  (kept in this browser's storage only)
     Flow: pull → merge → (if anything local is newer) push. Pull runs on
     connect, on page load, when the tab regains focus and every 3 minutes;
     push runs 1.5 s after the last local change. All of it is serialised
     through one queue so two runs never race. */
  const [syncCfg, setSyncCfg] = React.useState(loadSyncConfig);
  const [syncUI, setSyncUI] = React.useState({ status: syncCfg ? "idle" : "off", msg: "", lastAt: null }); /* off | idle | syncing | error */
  const [showSync, setShowSync] = React.useState(false);
  const [syncForm, setSyncForm] = React.useState(() => ({ token: (syncCfg && syncCfg.token) || "", gistId: (syncCfg && syncCfg.gistId) || "", pass: (syncCfg && syncCfg.pass) || "" }));
  const latest = React.useRef({ items, areaTags, brainDump });
  latest.current = { items, areaTags, brainDump };
  const metaAt = React.useRef({ areasAt: 0, brainAt: 0 });
  const firstMeta = React.useRef(true);
  React.useEffect(() => { if (firstMeta.current) { firstMeta.current = false; return; } metaAt.current.areasAt = Date.now(); }, [areaTags]);
  const firstBrain = React.useRef(true);
  React.useEffect(() => { if (firstBrain.current) { firstBrain.current = false; return; } metaAt.current.brainAt = Date.now(); }, [brainDump]);
  const lastPushed = React.useRef(""); /* serialized payload last known to be in the gist */
  const chain = React.useRef(Promise.resolve());
  const applyingRemote = React.useRef(false);

  const buildPayload = () => ({
    version: 2, savedAt: Date.now(),
    items: latest.current.items, tombstones: tombsRef.current,
    areas: latest.current.areaTags, areasAt: metaAt.current.areasAt,
    brainDump: latest.current.brainDump, brainAt: metaAt.current.brainAt
  });
  const payloadKey = p => JSON.stringify([p.items, p.tombstones, p.areas, p.brainDump]);

  /* merge a remote payload into local state; returns true if local changed */
  const applyRemote = remote => {
    const { items: merged, tombs } = mergeSets(latest.current.items, tombsRef.current, (remote.items || []).map(normalizeItem), remote.tombstones || {});
    tombsRef.current = tombs; saveTombstones(tombs);

        h("div", { style: { fontSize: 11, fontWeight: 600, letterSpacing: 0.6, textTransform: "uppercase", color: th.faint, marginBottom: 10 } }, "Mark tags as areas"),
        visibleTags.length === 0 && h("span", { style: { fontSize: 12.5, color: th.faint } }, "No tags yet \u2014 add tasks with #tags first."),
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: 7 } },
          visibleTags.map(tag => {
            const on = areaTags.some(x => sameTag(x, tag));
            return h("button", {
              key: tag, className: "ghost-btn", onClick: () => toggleArea(tag),
              title: on ? "Remove from areas" : "Mark as an area of responsibility",
              style: { fontSize: 11.5, fontWeight: 500, borderRadius: 20, padding: "4px 12px", cursor: "pointer",
                       background: on ? tagColor(tag) : "transparent", color: on ? "#fff" : th.muted,
                       border: "1px solid " + (on ? tagColor(tag) : th.border) }
            }, on ? "\u2713 " : "", tag);
          }))
      )
    ),

    /* ---------- Task list ---------- */
    Object.entries(grouped).map(([group, groupItems]) => {
      if (!groupItems || !groupItems.length) return null;
      const collapsed = collapsedGroups.has(group);
      const isProjectGroup = view === "projects";
      const isUpcomingGroup = view === "snoozed" && !groupByTag;
      const projNoNext = isProjectGroup && projectsWithoutNext.includes(group);
      return h("div", { key: group },
        groupingOn && group && h("div", {
          onClick: () => toggleGroup(group),
          style: { display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 600, color: th.muted, letterSpacing: 0.4, marginBottom: 10, marginTop: 20, cursor: "pointer", userSelect: "none", flexWrap: "wrap" }
        },
          h("span", { style: { display: "inline-flex", transform: collapsed ? "none" : "rotate(90deg)", transition: "transform 0.15s", color: th.faint } }, h(Icon, { name: "chevR", size: 12 })),
          h("span", { style: { color: isProjectGroup || isUpcomingGroup ? th.text : view === "people" ? personColor(group) : (group === "No tag" ? th.faint : tagColor(group)), fontSize: isProjectGroup || view === "people" || isUpcomingGroup ? 13.5 : 12, display: "inline-flex", alignItems: "center", gap: 6 } }, view === "people" && h(Icon, { name: "person", size: 13 }), isUpcomingGroup && h(Icon, { name: "clock", size: 13 }), group),
          isUpcomingGroup && groupItems.length > 0 && h("span", { style: { color: th.faint, fontWeight: 450, fontSize: 11.5 } }, fmtDay(groupItems[0].snoozedUntil) + (groupItems.length > 1 && fmtDay(groupItems[groupItems.length - 1].snoozedUntil) !== fmtDay(groupItems[0].snoozedUntil) ? " \u2192 " + fmtDay(groupItems[groupItems.length - 1].snoozedUntil) : "")),
          h("span", { style: { color: th.faint, fontWeight: 450 } }, groupItems.length),
          projNoNext && h("span", { style: { fontSize: 10.5, fontWeight: 600, color: th.warnText, background: th.warnBg, border: "1px solid " + th.warnBorder, borderRadius: 12, padding: "2px 10px" } }, "no next action"),
          view === "people" && h("button", {
            className: "ghost-btn", onClick: e => { e.stopPropagation(); copyAgenda(group); },
            title: "Copy a 1:1 agenda for " + group + " to the clipboard",
            style: { ...smallBtn, padding: "3px 10px", fontSize: 11, marginLeft: 6, display: "inline-flex", alignItems: "center", gap: 5, color: copiedAgendaFor === group ? th.green : th.muted, borderColor: copiedAgendaFor === group ? th.green + "66" : th.border }
          }, h(Icon, { name: copiedAgendaFor === group ? "check" : "copy", size: 11 }), copiedAgendaFor === group ? "Copied" : "Copy agenda")
        ),
        (!groupingOn || !group || !collapsed) && h("ul", { className: "task-columns", style: { listStyle: "none", padding: 0, margin: 0 } },
          groupItems.map(item => ItemRow({ item, showProjectBadge: view !== "projects", showStatusLabel: view === "projects" || view === "people" || view === "postponed" || globalSearch }))
        )
      );
    }),

    /* ---------- Empty state ---------- */
    view !== "areas" && visible.length === 0 && h("p", { style: { color: th.faint, textAlign: "center", marginTop: 56, marginBottom: 40, fontSize: 13.5, lineHeight: 1.7 } },
      search.trim() ? "No matches for “" + search.trim() + "”."
      : filterTags.length ? "Nothing matches the selected tags."
      : view === "inbox" ? "Inbox zero. Mind like water."
      : view === "next" ? "No next actions. Clarify your inbox, or activate something from Someday."
      : view === "waiting" ? "Not waiting on anything."
      : view === "someday" ? "The Someday / Maybe list is empty."
      : view === "projects" ? "No projects yet. Add a task with \"+ProjectName\", or attach a project on a task card."
      : view === "people" ? "Nobody here yet. Mention someone with \"@name\" in a task, or add a person on a task card."
      : view === "snoozed" ? "Nothing snoozed."
      : view === "postponed" ? "Nothing has been postponed " + POSTPONED_MANY + " times or more. Nice."
      : view === "doneToday" ? "Nothing completed today — yet."
      : "The archive is empty."
    ),

    /* ---------- Import / Export ---------- */
    h("div", { style: { display: "flex", justifyContent: "center", gap: 10, marginTop: 40, flexWrap: "wrap" } },
      h("button", { className: "ghost-btn", onClick: exportJSON, style: { ...smallBtn, display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 16px" } },
        h(Icon, { name: "download", size: 13 }), "Export JSON"),
      h("button", { className: "ghost-btn", onClick: () => fileRef.current?.click(), style: { ...smallBtn, display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 16px" } },
        h(Icon, { name: "upload", size: 13 }), "Import JSON"),
      h("input", { ref: fileRef, type: "file", accept: ".json", onChange: importJSON, style: { display: "none" } })
    ),

    /* ---------- Footer ---------- */
    h("p", { style: { color: th.timestamp, fontSize: 11, textAlign: "center", marginTop: 16, lineHeight: 1.7 } },
      "Double-click a task to edit · #tag, +project, @person and quoted #\u201Cmulti word\u201D forms work in the capture bar · #w8 sends a task straight to Waiting, #next / #someday likewise · ^3d, ^2w or ^2026-10-01 snoozes it on capture · every change is saved automatically")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Todo));
  </script>
</body>
</html>
